<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Centinel{% endblock %}</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>

  <div class="auth-wrapper">

    <div class="auth-brand-panel">
      <img src="{{ url_for('static', filename='img/camaraplaceholder.svg') }}" alt="Centinel">
      <h1 class="fw-bold text-white mb-2" style="letter-spacing: 1px;">CENTINEL</h1>
      <p class="text-secondary">Monitoreo inteligente de cámaras de seguridad en tiempo real.</p>
    </div>

    <div class="auth-form-panel">
      <div class="auth-card text-center">

        <div class="mb-4 d-lg-none">
          <div class="brand-icon mb-3 mx-auto">
            <i class="bi bi-camera-video-fill fs-3"></i>
            <span class="live-dot"></span>
          </div>
          <h2 class="fw-bold text-white mb-0">CENTINEL</h2>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="alert alert-danger p-2 small mb-3 text-start" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-1"></i> {{ message }}
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        {% block auth_content %}{% endblock %}

      </div>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
