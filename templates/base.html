<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Centinel - Centro de Control{% endblock %}</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-dark navbar-centinela sticky-top py-2">
    <div class="container-fluid px-4">
      <a class="navbar-brand brand-logo" href="/">
        <span class="live-dot" title="Sistema Activo"></span>
        <i class="bi bi-camera-video-fill icon-blue"></i> CENTINEL
      </a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-4">
          <li class="nav-item">
            <a class="nav-link active" href="{{ url_for('dashboard.inicio') }}"><i class="bi bi-house-door-fill icon-blue me-1"></i> <span data-i18n="nav_inicio">Inicio</span></a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="{{ url_for('dashboard.camaras') }}"><i class="bi bi-grid-1x2-fill icon-yellow me-1"></i> <span data-i18n="nav_camaras">Cámaras</span></a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="{{ url_for('dashboard.grabaciones') }}"><i class="bi bi-collection-play-fill icon-red me-1"></i> <span data-i18n="nav_grabaciones">Grabaciones</span></a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="{{ url_for('dashboard.ajustes') }}"><i class="bi bi-gear-fill icon-yellow me-1"></i> <span data-i18n="nav_ajustes">Ajustes</span></a>
          </li>
          {% if current_user.is_authenticated and current_user.es_admin() %}
          <li class="nav-item">
            <a class="nav-link" href="{{ url_for('dashboard.administracion') }}"><i class="bi bi-people-fill icon-red me-1"></i> <span data-i18n="nav_administracion">Administración</span></a>
          </li>
          {% endif %}
        </ul>

        <div class="d-flex align-items-center gap-3">
          <span class="badge bg-danger text-white"><i class="bi bi-record-circle me-1"></i> <span data-i18n="live">EN VIVO</span></span>
          <a href="{{ url_for('dashboard.perfil') }}" class="nav-link mb-0 p-0"><i class="bi bi-person-circle fs-5 icon-blue"></i></a>
          <a href="{{ url_for('auth.logout') }}" class="btn btn-outline-light btn-sm"><i class="bi bi-box-arrow-right me-1"></i> <span data-i18n="nav_salir">Salir</span></a>
        </div>
      </div>
    </div>
  </nav>

  <main class="container-fluid main-container px-4">
    {% block content %}{% endblock %}
  </main>

  <footer class="py-3 text-center">
    <div><span data-i18n="footer_text">Centinel © 2026 - Sistema de Monitoreo de Cámaras</span></div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
