{% extends "base.html" %}

{% block title %}Inicio{% endblock %}

{% block content %}
<h2>Hola, {{ current_user.nombre }} 👋</h2>
<p class="text-muted" data-i18n="inicio_bienvenida">
  Bienvenido a Centinel. Desde acá podés visualizar tus cámaras en tiempo real y consultar
  las grabaciones almacenadas.
</p>

<div class="row g-3 mt-2" id="accesos-camaras">
  <!-- Se completa dinámicamente con JS desde /api/camaras -->
</div>

<script>
fetch("/api/camaras")
  .then(r => r.json())
  .then(camaras => {
    const cont = document.getElementById("accesos-camaras");
    camaras.forEach(c => {
      const col = document.createElement("div");
      col.className = "col-6 col-md-3";
      col.innerHTML = `
        <a href="/camaras?cam=${c.id}" class="card camera-shortcut text-decoration-none">
          <div class="card-body text-center">
            <i class="bi bi-camera-video-fill fs-2 icon-blue"></i>
            <div class="fw-semibold mt-2">${c.nombre}</div>
            <span class="badge ${c.estado === 'activa' ? 'bg-success' : 'bg-secondary'}">${c.estado}</span>
          </div>
        </a>`;
      cont.appendChild(col);
    });
  });
</script>
{% endblock %}
