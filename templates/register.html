{% extends "base_auth.html" %}

{% block title %}Registrarse{% endblock %}

{% block auth_content %}

<form method="POST" class="text-start">
  <div class="row">
    <div class="col-6 mb-3">
      <label class="form-label small text-white-50 fw-semibold">Nombre</label>
      <input type="text" name="nombre" class="form-control form-control-custom" value="{{ nombre or '' }}" required autofocus>
    </div>
    <div class="col-6 mb-3">
      <label class="form-label small text-white-50 fw-semibold">Apellido</label>
      <input type="text" name="apellido" class="form-control form-control-custom" value="{{ apellido or '' }}" required>
    </div>
  </div>

  <div class="mb-3">
    <label class="form-label small text-white-50 fw-semibold">Correo electrónico</label>
    <input type="email" name="correo" class="form-control form-control-custom" value="{{ correo or '' }}" required>
  </div>

  <div class="mb-3">
    <label class="form-label small text-white-50 fw-semibold">Contraseña</label>
    <input type="password" name="password" class="form-control form-control-custom" required minlength="8">
    <div class="form-text">Mínimo 8 caracteres.</div>
  </div>

  <div class="mb-4">
    <label class="form-label small text-white-50 fw-semibold">Confirmar contraseña</label>
    <input type="password" name="confirmar" class="form-control form-control-custom" required minlength="8">
  </div>

  <button type="submit" class="btn btn-centinela w-100 mb-3">
    <i class="bi bi-person-plus-fill me-2"></i>Registrarse
  </button>
</form>

<div class="mb-3">
  <a href="{{ url_for('auth.login') }}" class="small text-warning text-decoration-none">Ya tengo una cuenta</a>
</div>

{% endblock %}
